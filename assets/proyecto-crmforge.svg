<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t">
<title id="t">CRMForge — constructor de CRM a medida</title>
<defs><linearGradient id="borde" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f5f5f5"/><stop offset=".5" stop-color="#cdcdcd"/><stop offset="1" stop-color="#5f5f5f"/></linearGradient></defs>
<style>text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.cursor{animation:parp 1s steps(1) infinite}@keyframes parp{50%{opacity:0}}
.pulso{animation:pulso 1.6s ease-in-out infinite}@keyframes pulso{50%{opacity:.25}}
@keyframes viaja{0%,12%{transform:translateX(0)}30%,46%{transform:translateX(70px)}64%,88%{transform:translateX(140px)}100%{transform:translateX(140px);opacity:0}}
@keyframes aparece{0%,6%{opacity:0;transform:translateY(-8px)}14%,100%{opacity:1;transform:none}}
.mueve{animation:viaja 7s cubic-bezier(.22,1,.36,1) infinite}
.nueva{animation:aparece 7s ease-out infinite}
.ok{animation:pulso 2s ease-in-out infinite}</style>
<rect width="960" height="400" rx="18" fill="#0a0a0a"/>
<rect x="9" y="9" width="942" height="382" rx="13" fill="none" stroke="url(#borde)" stroke-width="2"/>
