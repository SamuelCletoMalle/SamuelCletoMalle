<text x="490" y="117" fill="#e9c776" font-size="14">en desarrollo</text>
<text x="50" y="152" fill="#e2b75a" font-size="30" font-weight="700">CRMForge</text>
<text x="216" y="152" fill="#f6f5f1" font-size="18">tu CRM, a medida</text>
<text x="50" y="186" fill="#e7e5df" font-size="15">Constructor de CRM: cada empresa monta el suyo con módulos,</text>
<text x="50" y="208" fill="#e7e5df" font-size="15">campos y vistas propias. Permisos por rol en la base de</text>
<text x="50" y="230" fill="#e7e5df" font-size="15">datos, equipos con invitación, automatizaciones e informes.</text>
<rect x="50" y="256" width="82" height="28" rx="6" fill="#1a1712" stroke="#a8792c"/>
<text x="61" y="275" fill="#e9c776" font-size="14">Next.js</text>
<rect x="142" y="256" width="66" height="28" rx="6" fill="#1a1712" stroke="#a8792c"/>
<text x="153" y="275" fill="#e9c776" font-size="14">React</text>
<rect x="218" y="256" width="91" height="28" rx="6" fill="#1a1712" stroke="#a8792c"/>
<text x="229" y="275" fill="#e9c776" font-size="14">Supabase</text>
<rect x="319" y="256" width="108" height="28" rx="6" fill="#1a1712" stroke="#a8792c"/>
<text x="330" y="275" fill="#e9c776" font-size="14">PostgreSQL</text>
<rect x="437" y="256" width="91" height="28" rx="6" fill="#1a1712" stroke="#a8792c"/>
<text x="448" y="275" fill="#e9c776" font-size="14">Tailwind</text>
<text x="50" y="324" fill="#9d9b94" font-size="14"><tspan fill="#e2b75a">✔</tspan> módulos  <tspan fill="#e2b75a">✔</tspan> roles  <tspan fill="#e2b75a">✔</tspan> automatizaciones  <tspan fill="#e2b75a">✔</tspan> informes  <tspan fill="#e2b75a">✔</tspan> CSV</text>
<text x="50" y="356" fill="#f6e3a8" font-size="14">❯ npm test  <tspan fill="#9d9b94">→</tspan>  <tspan fill="#5ee0b0">232 pruebas ✔</tspan>  <tspan fill="#9d9b94">· 15 migraciones SQL</tspan><tspan class="cursor" fill="#e2b75a">█</tspan></text>
