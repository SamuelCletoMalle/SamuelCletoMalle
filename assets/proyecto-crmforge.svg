<rect x="29" y="74" width="640" height="302" rx="9" fill="#121110" stroke="#a8792c" stroke-width="1.5"/>
<text x="50" y="112" fill="#f6e3a8" font-size="18" font-weight="700">❯ ./crmforge --info</text>
