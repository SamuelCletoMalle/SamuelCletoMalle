<text x="490" y="117" fill="#e4e4e4" font-size="14">en desarrollo</text>
<text x="50" y="152" fill="#cdcdcd" font-size="30" font-weight="700">CRMForge</text>
<text x="216" y="152" fill="#f5f5f5" font-size="18">tu CRM, a medida</text>
<text x="50" y="186" fill="#e3e3e3" font-size="15">Constructor de CRM: cada empresa monta el suyo con módulos,</text>
<text x="50" y="208" fill="#e3e3e3" font-size="15">campos y vistas propias. Permisos por rol en la base de</text>
<text x="50" y="230" fill="#e3e3e3" font-size="15">datos, equipos con invitación, automatizaciones e informes.</text>
<rect x="50" y="256" width="82" height="28" rx="6" fill="#141414" stroke="#5f5f5f"/>
<text x="61" y="275" fill="#e4e4e4" font-size="14">Next.js</text>
