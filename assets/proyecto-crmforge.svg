<text x="153" y="275" fill="#e4e4e4" font-size="14">React</text>
<rect x="218" y="256" width="91" height="28" rx="6" fill="#141414" stroke="#5f5f5f"/>
<text x="229" y="275" fill="#e4e4e4" font-size="14">Supabase</text>
<rect x="319" y="256" width="108" height="28" rx="6" fill="#141414" stroke="#5f5f5f"/>
<text x="330" y="275" fill="#e4e4e4" font-size="14">PostgreSQL</text>
<rect x="437" y="256" width="91" height="28" rx="6" fill="#141414" stroke="#5f5f5f"/>
<text x="448" y="275" fill="#e4e4e4" font-size="14">Tailwind</text>
<text x="50" y="324" fill="#999999" font-size="14"><tspan fill="#e2b75a">✔</tspan> módulos  <tspan fill="#e2b75a">✔</tspan> roles  <tspan fill="#e2b75a">✔</tspan> automatizaciones  <tspan fill="#e2b75a">✔</tspan> informes  <tspan fill="#e2b75a">✔</tspan> CSV</text>
<text x="50" y="356" fill="#f5f5f5" font-size="14">❯ npm test  <tspan fill="#999999">→</tspan>  <tspan fill="#e2b75a">232 pruebas ✔</tspan>  <tspan fill="#999999">· 15 migraciones SQL</tspan><tspan class="cursor" fill="#e2b75a">█</tspan></text>
