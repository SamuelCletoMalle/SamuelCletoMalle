<text x="50" y="152" fill="#5b9dff" font-size="30" font-weight="700">Balanz</text>
<text x="178" y="152" fill="#ffc861" font-size="18">app de finanzas personales</text>
<text x="50" y="186" fill="#dbe3f3" font-size="15">Controla gastos por categorías y presupuesto, importa y</text>
<text x="50" y="208" fill="#dbe3f3" font-size="15">exporta a Excel detectando duplicados, guarda en local</text>
<text x="50" y="230" fill="#dbe3f3" font-size="15">y sincroniza en la nube con login.</text>
<rect x="50" y="256" width="126" height="28" rx="6" fill="#0c1a33" stroke="#3b7ddd"/>
<text x="61" y="275" fill="#7db3ff" font-size="14">React Native</text>
