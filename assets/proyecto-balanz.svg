<text x="197" y="275" fill="#7db3ff" font-size="14">Expo</text>
<rect x="252" y="256" width="108" height="28" rx="6" fill="#0c1a33" stroke="#3b7ddd"/>
<text x="263" y="275" fill="#7db3ff" font-size="14">TypeScript</text>
<rect x="370" y="256" width="74" height="28" rx="6" fill="#0c1a33" stroke="#3b7ddd"/>
<text x="381" y="275" fill="#7db3ff" font-size="14">SQLite</text>
<rect x="454" y="256" width="91" height="28" rx="6" fill="#0c1a33" stroke="#3b7ddd"/>
<text x="465" y="275" fill="#7db3ff" font-size="14">Supabase</text>
<text x="50" y="324" fill="#9aa6bd" font-size="14"><tspan fill="#5b9dff">✔</tspan> categorías  <tspan fill="#5b9dff">✔</tspan> presupuesto  <tspan fill="#5b9dff">✔</tspan> Excel  <tspan fill="#5b9dff">✔</tspan> login + nube</text>
<text x="50" y="356" fill="#28bee6" font-size="14">❯ git clone github.com/SamuelCletoMalle/Balanz-App<tspan class="cursor" fill="#5b9dff">█</tspan></text>
<circle class="pulso" cx="520" cy="112" r="5" fill="#5b9dff"/>
