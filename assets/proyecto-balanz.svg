<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t">
<title id="t">Balanz — app de finanzas personales</title>
<defs><linearGradient id="borde" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#5b9dff"/><stop offset="1" stop-color="#28bee6"/></linearGradient>
<linearGradient id="g" x1="0" x2="0" y1="1" y2="0"><stop stop-color="#3b7ddd"/><stop offset="1" stop-color="#5b9dff"/></linearGradient></defs>
<style>text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.cursor{animation:parp 1s steps(1) infinite}@keyframes parp{50%{opacity:0}}
.pulso{animation:pulso 1.6s ease-in-out infinite}@keyframes pulso{50%{opacity:.25}}
@keyframes sube{0%{transform:scaleY(0)}18%,85%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes entra{0%,8%{opacity:0;transform:translateX(12px)}18%,85%{opacity:1;transform:none}100%{opacity:0}}
.moneda{animation:flota 2.4s ease-in-out infinite}@keyframes flota{50%{transform:translateY(-6px)}}
.b0{animation:sube 6s 0.00s cubic-bezier(.22,1,.36,1) infinite}
.b1{animation:sube 6s 0.15s cubic-bezier(.22,1,.36,1) infinite}
.b2{animation:sube 6s 0.30s cubic-bezier(.22,1,.36,1) infinite}
.b3{animation:sube 6s 0.45s cubic-bezier(.22,1,.36,1) infinite}
.b4{animation:sube 6s 0.60s cubic-bezier(.22,1,.36,1) infinite}
.b5{animation:sube 6s 0.75s cubic-bezier(.22,1,.36,1) infinite}
.r0{animation:entra 6s 1.20s infinite}
.r1{animation:entra 6s 1.55s infinite}
.r2{animation:entra 6s 1.90s infinite}</style>
<rect width="960" height="400" rx="18" fill="#0b1222"/>
<rect x="9" y="9" width="942" height="382" rx="13" fill="none" stroke="url(#borde)" stroke-width="2"/>
