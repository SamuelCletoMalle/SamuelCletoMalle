<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Samuel Cleto Malle — Desarrollador junior</title>
  <desc id="desc">Tarjeta de terminal con el perfil de Samuel: formación, objetivo, experiencia y lo que está construyendo ahora.</desc>
  <defs>
    <linearGradient id="borde" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#5b9dff"/>
      <stop offset="1" stop-color="#28bee6"/>
    </linearGradient>
    <linearGradient id="barra" x1="0" x2="1">
      <stop stop-color="#5b9dff"/>
      <stop offset="1" stop-color="#28bee6"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .cursor { animation: parpadeo 1s steps(1) infinite; }
    @keyframes parpadeo { 50% { opacity: 0; } }
    .p1 { animation: llenar1 2.2s cubic-bezier(.22,1,.36,1) forwards; }
    .p2 { animation: llenar2 2.6s cubic-bezier(.22,1,.36,1) forwards; }
    .p3 { animation: llenar3 3s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes llenar1 { from { width: 0; } to { width: 150px; } }
    @keyframes llenar2 { from { width: 0; } to { width: 115px; } }
    @keyframes llenar3 { from { width: 0; } to { width: 192px; } }
    .pulso { animation: pulso 1.6s ease-in-out infinite; }
    @keyframes pulso { 50% { opacity: .25; } }
  </style>

  <rect width="960" height="420" rx="18" fill="#0b1222"/>
  <rect x="9" y="9" width="942" height="402" rx="13" fill="none" stroke="url(#borde)" stroke-width="2"/>
  <circle cx="35" cy="35" r="5" fill="#ff6b6b"/>
  <circle cx="54" cy="35" r="5" fill="#ffc861"/>
  <circle cx="73" cy="35" r="5" fill="#5ee0b0"/>
  <text x="98" y="41" fill="#9aa6bd" font-size="15">samuel@dev  ·  profile shell  ·  online</text>
  <path d="M29 58H931" stroke="#1e2a44"/>

  <!-- panel izquierdo -->
  <rect x="29" y="78" width="594" height="301" rx="9" fill="#111a2e" stroke="#3b7ddd" stroke-width="1.5"/>
  <text x="48" y="111" fill="#28bee6" font-size="20" font-weight="700">❯ whoami</text>
  <text x="48" y="143" fill="#dbe3f3" font-size="18">samuel_cleto</text>
  <text x="190" y="143" fill="#9aa6bd" font-size="18">—</text>
  <text x="215" y="143" fill="#ffc861" font-size="18">Desarrollador junior</text>

  <path d="M48 166H604" stroke="#1e2a44"/>
  <text x="48" y="196" fill="#9aa6bd" font-size="17">formación:</text>
  <text x="178" y="196" fill="#7db3ff" font-size="17">2º DAM · antes SMR</text>
  <text x="48" y="225" fill="#9aa6bd" font-size="17">objetivo:</text>
  <text x="178" y="225" fill="#8fd8f0" font-size="17">prácticas o primer puesto como dev</text>

  <text x="48" y="267" fill="#28bee6" font-size="20" font-weight="700">❯ ls experiencia/</text>
  <text x="48" y="299" fill="#5b9dff" font-size="16">backend/</text>
  <text x="200" y="299" fill="#dbe3f3" font-size="16">Java · Python · FastAPI · SQL</text>
  <text x="48" y="326" fill="#5b9dff" font-size="16">apps_y_juegos/</text>
  <text x="200" y="326" fill="#dbe3f3" font-size="16">React · React Native · Android</text>
  <text x="48" y="353" fill="#5b9dff" font-size="16">sistemas/</text>
  <text x="200" y="353" fill="#dbe3f3" font-size="16">Windows · Linux · Redes · Hardware</text>

  <!-- panel derecho: procesos en marcha -->
  <rect x="651" y="78" width="280" height="301" rx="9" fill="#111a2e" stroke="#3b7ddd" stroke-width="1.5"/>
  <text x="674" y="111" fill="#28bee6" font-size="18" font-weight="700">❯ ps --mine</text>

  <circle cx="680" cy="146" r="4" fill="#5ee0b0" class="pulso"/>
  <text x="692" y="151" fill="#ffc861" font-size="15">dam_2.curso</text>
  <text x="692" y="171" fill="#9aa6bd" font-size="12">desarrollo de apps multiplataforma</text>
  <rect x="692" y="180" width="192" height="8" rx="4" fill="#1e2a44"/>
  <rect x="692" y="180" width="0" height="8" rx="4" fill="url(#barra)" class="p1"/>

  <circle cx="680" cy="214" r="4" fill="#5ee0b0" class="pulso"/>
  <text x="692" y="219" fill="#ffc861" font-size="15">balanz.app</text>
  <text x="692" y="239" fill="#9aa6bd" font-size="12">finanzas · React Native</text>
  <rect x="692" y="248" width="192" height="8" rx="4" fill="#1e2a44"/>
  <rect x="692" y="248" width="0" height="8" rx="4" fill="url(#barra)" class="p2"/>

  <circle cx="680" cy="282" r="4" fill="#5ee0b0" class="pulso"/>
  <text x="692" y="287" fill="#ffc861" font-size="15">practicas.fct</text>
  <text x="692" y="307" fill="#9aa6bd" font-size="12">disponible · jornada completa marzo</text>
  <rect x="692" y="316" width="192" height="8" rx="4" fill="#1e2a44"/>
  <rect x="692" y="316" width="0" height="8" rx="4" fill="url(#barra)" class="p3"/>

  <text x="674" y="356" fill="#9aa6bd" font-size="14">status: siempre aprendiendo<tspan class="cursor">▋</tspan></text>
</svg>
