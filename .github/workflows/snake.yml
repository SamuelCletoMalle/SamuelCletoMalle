name: Generar serpiente de contribuciones

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar SVG de la serpiente
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#a8792c&color_dots=#ebedf0,#f3e4b8,#e2b75a,#b8862e,#7a5a1e
            dist/snake-dark.svg?palette=github-dark&color_snake=#e2b75a&color_dots=#161513,#3d2f12,#7a5a1e,#b8862e,#e2b75a

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
